<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A patient question and an assistant answer, with clinic documents the assistant looks up">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A57"/>
      <stop offset="1" stop-color="#1E6FE0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- patient question -->
  <rect x="24" y="36" width="210" height="46" rx="12" fill="#FFFFFF"/>
  <text x="40" y="64" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111111">Can I move my appointment?</text>

  <!-- assistant answer -->
  <rect x="80" y="104" width="210" height="66" rx="12" fill="#EEF4FF"/>
  <text x="96" y="130" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1857B4">Yes. Please call the office</text>
  <text x="96" y="150" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1857B4">at least 24 hours before.</text>

  <!-- line from answer to documents -->
  <path d="M290 137 C 320 137, 320 200, 300 214" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- clinic documents -->
  <g fill="#FFFFFF" fill-opacity="0.92">
    <rect x="232" y="206" width="44" height="56" rx="4"/>
    <rect x="284" y="206" width="44" height="56" rx="4"/>
    <rect x="336" y="206" width="44" height="56" rx="4"/>
  </g>
  <g stroke="#1E6FE0" stroke-width="2">
    <line x1="240" y1="222" x2="268" y2="222"/><line x1="240" y1="232" x2="268" y2="232"/><line x1="240" y1="242" x2="260" y2="242"/>
    <line x1="292" y1="222" x2="320" y2="222"/><line x1="292" y1="232" x2="320" y2="232"/><line x1="292" y1="242" x2="312" y2="242"/>
    <line x1="344" y1="222" x2="372" y2="222"/><line x1="344" y1="232" x2="372" y2="232"/><line x1="344" y1="242" x2="364" y2="242"/>
  </g>
  <text x="24" y="228" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Answers from</text>
  <text x="24" y="246" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">clinic documents,</text>
  <text x="24" y="264" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">run on a laptop</text>
</svg>
